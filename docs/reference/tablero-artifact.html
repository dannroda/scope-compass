<title>Tablero Epiphany</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabecera con hitos como pestañas, resumen del hito, tablero de 4 columnas y panel de detalle lateral */
:root {
  --bg: #f3f1ec; --surface: #fbfaf7; --surface-2: #ebe7de; --line: #d6cfc0;
  --fg: #23211c; --muted: #655e51; --accent: #8f620f; --accent-soft: #f1e3c3; --on-accent: #fffaf0;
  --s-todo: #7a7263; --s-doing: #2d5f8a; --s-review: #9a5b12; --s-done: #2f6f4f; --danger: #a33a2a;
  --font-display: 'Cinzel', Georgia, serif;
  --font-body: 'Alegreya Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --shadow: 0 1px 2px rgba(35, 33, 28, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318; --surface: #171b22; --surface-2: #1f252e; --line: #2e3642;
    --fg: #ece5d6; --muted: #a69d8c; --accent: #d9a441; --accent-soft: #3a2f1a; --on-accent: #1a1408;
    --s-todo: #9a917f; --s-doing: #7fb0dc; --s-review: #e0a95a; --s-done: #6fbf94; --danger: #e8806e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101318; --surface: #171b22; --surface-2: #1f252e; --line: #2e3642;
  --fg: #ece5d6; --muted: #a69d8c; --accent: #d9a441; --accent-soft: #3a2f1a; --on-accent: #1a1408;
  --s-todo: #9a917f; --s-doing: #7fb0dc; --s-review: #e0a95a; --s-done: #6fbf94; --danger: #e8806e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); }
.wrap { padding-block: 20px 48px; padding-inline: 20px; max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: .82em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-size: clamp(22px, 3vw, 30px); letter-spacing: .08em; text-wrap: balance; }
h1 small { font-family: var(--font-body); font-size: 15px; letter-spacing: 0; color: var(--muted); font-weight: 500; margin-left: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }

nav.miles { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 15px; }
.chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip[aria-pressed="true"] .n { color: var(--on-accent); }
.chip.complete:not([aria-pressed="true"]) { color: var(--s-done); border-color: var(--s-done); }

section.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
.summary h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; text-wrap: balance; }
.summary p { margin: 0; color: var(--muted); max-width: 65ch; }
.summary .label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.summary ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; max-width: 320px; }
.bar > i { display: block; height: 100%; background: var(--s-done); }

.newtask { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.newtask input[type="text"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
.newtask select, .detail select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-height: 40px; }

main.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col h3 { margin: 2px 4px 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.col h3 .dot { width: 9px; height: 9px; border-radius: 50%; }
.col h3 .n { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0; }
.empty-col { color: var(--muted); font-size: 14px; padding: 10px 6px; }

.card { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); border-left-width: 1px; }
.card:hover { border-color: var(--accent); }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card .meta { display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card .meta .ms { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.card .t { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.card .cl { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .cl .bar { max-width: none; height: 4px; }

.detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, .12); padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; z-index: 10; }
.detail .head { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.detail .head .close { margin-left: auto; }
.detail input.title { width: 100%; border: 1px solid transparent; background: transparent; font-size: 22px; font-weight: 700; padding: 4px 6px; border-radius: 6px; }
.detail input.title:hover, .detail input.title:focus { border-color: var(--line); background: var(--bg); }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 8px 4px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; box-shadow: var(--shadow); }
.detail .label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.detail textarea { width: 100%; min-height: 72px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 6px; }
.checklist li:hover { background: var(--bg); }
.checklist input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.checklist label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.checklist li.done label { color: var(--muted); text-decoration: line-through; }
.checklist .rm { border: 0; background: transparent; color: var(--muted); padding: 0 6px; min-height: 28px; }
.addcl { display: flex; gap: 8px; }
.addcl input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.footer-actions { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 16px 18px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 980px) { main.board { grid-template-columns: repeat(2, minmax(0, 1fr)); } section.summary { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { main.board { grid-template-columns: minmax(0, 1fr); } .wrap { padding-inline: 16px; } }
@media (prefers-reduced-motion: no-preference) { .card, .chip, .btn { transition: border-color .15s, background-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Project Epiphany <small>tareas hacia el MVP</small></h1>
    <button class="btn primary" id="new-btn" type="button">Nueva tarea</button>
  </header>
  <nav class="miles" id="miles" aria-label="Hitos"></nav>
  <form class="newtask" id="new-form" hidden>
    <label for="new-title" class="sr">Título</label>
    <input type="text" id="new-title" placeholder="Qué hay que hacer" autocomplete="off" required>
    <label for="new-ms" class="sr">Hito</label>
    <select id="new-ms"></select>
    <button class="btn primary" type="submit">Agregar</button>
    <button class="btn ghost" type="button" id="new-cancel">Cancelar</button>
  </form>
  <section class="summary" id="summary" aria-live="polite"></section>
  <main class="board" id="board" aria-label="Tablero"></main>
</div>
<aside class="detail" id="detail" hidden aria-label="Detalle de la tarea"></aside>
<div class="toast" id="toast" role="status" hidden></div>

<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>

<script>
(function () {
  const STATUSES = [
    { id: 'todo', label: 'Pendiente', color: 'var(--s-todo)' },
    { id: 'doing', label: 'En curso', color: 'var(--s-doing)' },
    { id: 'review', label: 'Revisión', color: 'var(--s-review)' },
    { id: 'done', label: 'Hecho', color: 'var(--s-done)' }
  ];
  const S = { milestones: [], tasks: [], filter: pref('filter') || 'all', openId: null, confirmDelete: false, loaded: false, offline: false };
  let db = null;

  function pref(k, v) {
    try {
      if (v === undefined) return localStorage.getItem('epiphany.' + k);
      localStorage.setItem('epiphany.' + k, v);
    } catch (e) { return null; }
  }

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  // `código` inline -> <code>, el resto como texto plano
  function rich(str) {
    const frag = document.createDocumentFragment();
    String(str || '').split('`').forEach((part, i) => {
      if (!part) return;
      frag.append(i % 2 ? h('code', null, part) : document.createTextNode(part.replace(/\*\*/g, '')));
    });
    return frag;
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3200);
  }

  const now = () => new Date().toISOString();
  const msById = (id) => S.milestones.find((m) => m.id === id);
  const visibleTasks = () => S.tasks.filter((t) => S.filter === 'all' || t.milestone === S.filter);
  const sortTasks = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.code || '').localeCompare(String(b.code || ''), 'es', { numeric: true });
  function clProgress(t) {
    const cl = Array.isArray(t.checklist) ? t.checklist : [];
    return { done: cl.filter((c) => c.done).length, total: cl.length };
  }

  async function write(fn, okMsg) {
    if (!db) { toast('Sin conexión con el almacenamiento: el cambio no se guardó.'); return; }
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Se llenó el almacenamiento del tablero: borrá tareas viejas.' : 'No se pudo guardar (' + (e && e.code || 'error') + '). Probá de nuevo.'); }
  }
  const updateTask = (id, patch) => write(() => db.doc('tasks/' + id).update({ ...patch, updated_at: now() }));

  function renderMiles() {
    const nav = document.getElementById('miles');
    nav.replaceChildren();
    const all = S.tasks.length, allDone = S.tasks.filter((t) => t.status === 'done').length;
    nav.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': S.filter === 'all' ? 'true' : 'false', onclick: () => setFilter('all') },
      'Todos', h('span', { class: 'n' }, allDone + '/' + all)));
    for (const m of S.milestones) {
      const ts = S.tasks.filter((t) => t.milestone === m.id);
      const d = ts.filter((t) => t.status === 'done').length;
      const complete = ts.length > 0 && d === ts.length;
      nav.append(h('button', { class: 'chip' + (complete ? ' complete' : ''), type: 'button', title: m.title, 'aria-pressed': S.filter === m.id ? 'true' : 'false', onclick: () => setFilter(m.id) },
        m.code, h('span', { class: 'n' }, ts.length ? d + '/' + ts.length : '—')));
    }
    const sel = document.getElementById('new-ms');
    const cur = sel.value;
    sel.replaceChildren(...S.milestones.map((m) => h('option', { value: m.id }, m.code + ' · ' + m.title)));
    sel.value = cur || (S.filter !== 'all' ? S.filter : (S.milestones[0] && S.milestones[0].id) || '');
  }

  function renderSummary() {
    const box = document.getElementById('summary');
    box.replaceChildren();
    if (S.offline) {
      box.hidden = false;
      box.append(h('div', { class: 'notice', style: 'grid-column: 1 / -1' }, 'No se pudo conectar con el almacenamiento del tablero en esta vista. Abrilo desde claude.ai con tu cuenta para ver y editar las tareas.'));
      return;
    }
    if (!S.loaded) { box.hidden = false; box.append(h('p', null, 'Cargando tareas…')); return; }
    if (!S.milestones.length && !S.tasks.length) {
      box.hidden = false;
      box.append(h('div', { style: 'grid-column: 1 / -1' }, h('h2', null, 'Tablero vacío'),
        h('p', null, 'Agregá una tarea con “Nueva tarea”, o pedile a Claude que cargue los hitos y las tareas del GDD.')));
      return;
    }
    const ts = visibleTasks();
    const d = ts.filter((t) => t.status === 'done').length;
    const pct = ts.length ? Math.round((d / ts.length) * 100) : 0;
    const m = S.filter === 'all' ? null : msById(S.filter);
    const left = h('div', null,
      h('h2', null, m ? m.code + ' · ' + m.title : 'Todos los hitos'),
      h('p', null, rich(m ? m.goal : 'Roadmap al MVP: overworld chico + una mazmorra completa. Elegí un hito para ver su objetivo.')),
      h('div', { class: 'progress' }, h('div', { class: 'bar', role: 'img', 'aria-label': pct + '% hecho' }, h('i', { style: 'width:' + pct + '%' })), d + '/' + ts.length + ' tareas'));
    const right = h('div', null);
    if (m && Array.isArray(m.done_when) && m.done_when.length) {
      right.append(h('div', { class: 'label' }, 'Hecho cuando'), h('ul', null, m.done_when.map((x) => h('li', null, rich(x)))));
    } else if (!m) {
      right.append(h('div', { class: 'label' }, 'Por estado'),
        h('ul', null, STATUSES.map((s) => h('li', null, s.label + ': ' + S.tasks.filter((t) => t.status === s.id).length))));
    }
    box.hidden = false;
    box.append(left, right);
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.replaceChildren();
    const ts = visibleTasks().slice().sort(sortTasks);
    for (const s of STATUSES) {
      const items = ts.filter((t) => (t.status || 'todo') === s.id);
      const col = h('section', { class: 'col', 'aria-label': s.label,
        ondragover: (e) => { e.preventDefault(); col.classList.add('over'); },
        ondragleave: () => col.classList.remove('over'),
        ondrop: (e) => { e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) setStatus(id, s.id); } },
        h('h3', null, h('span', { class: 'dot', style: 'background:' + s.color }), s.label, h('span', { class: 'n' }, items.length)));
      if (!items.length) col.append(h('div', { class: 'empty-col' }, S.loaded ? 'Sin tareas' : ''));
      for (const t of items) col.append(cardFor(t, s));
      board.append(col);
    }
  }

  function cardFor(t, s) {
    const p = clProgress(t);
    const m = msById(t.milestone);
    const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
    return h('button', { class: 'card', type: 'button', draggable: 'true', style: 'border-left: 4px solid ' + s.color,
      'aria-current': S.openId === t.id ? 'true' : null,
      ondragstart: (e) => { e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move'; },
      onclick: () => openTask(t.id) },
      h('span', { class: 'meta' }, t.code ? h('span', null, t.code) : null, m && S.filter === 'all' ? h('span', { class: 'ms' }, m.code) : null),
      h('span', { class: 't' }, rich(t.title)),
      p.total ? h('span', { class: 'cl' }, h('span', { class: 'bar', role: 'img', 'aria-label': p.done + ' de ' + p.total + ' pasos' }, h('i', { style: 'width:' + pct + '%' })), p.done + '/' + p.total) : null);
  }

  function renderDetail() {
    const box = document.getElementById('detail');
    const t = S.tasks.find((x) => x.id === S.openId);
    if (!t) { box.hidden = true; box.replaceChildren(); return; }
    const m = msById(t.milestone);
    const cl = Array.isArray(t.checklist) ? t.checklist : [];
    const p = clProgress(t);
    const keepFocus = document.activeElement && box.contains(document.activeElement) ? document.activeElement.id : null;
    box.replaceChildren(
      h('div', { class: 'head' }, t.code || '', m ? h('span', null, '· ' + m.code + ' ' + m.title) : null,
        h('button', { class: 'btn ghost close', type: 'button', 'aria-label': 'Cerrar detalle', onclick: closeTask }, 'Cerrar')),
      h('label', { for: 'd-title', class: 'sr' }, 'Título'),
      h('input', { class: 'title', id: 'd-title', value: t.title || '', onchange: (e) => { const v = e.target.value.trim(); if (v && v !== t.title) updateTask(t.id, { title: v }); } }),
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Estado' }, STATUSES.map((s) =>
        h('button', { type: 'button', 'aria-pressed': (t.status || 'todo') === s.id ? 'true' : 'false', onclick: () => setStatus(t.id, s.id) }, s.label))),
      h('div', { style: 'display:flex;flex-direction:column;gap:6px' },
        h('label', { class: 'label', for: 'd-ms' }, 'Hito'),
        h('select', { id: 'd-ms', onchange: (e) => updateTask(t.id, { milestone: e.target.value }) },
          S.milestones.map((x) => h('option', { value: x.id, selected: x.id === t.milestone }, x.code + ' · ' + x.title)))),
      h('div', { style: 'display:flex;flex-direction:column;gap:6px' },
        h('span', { class: 'label' }, 'Pasos ' + (p.total ? '(' + p.done + '/' + p.total + ')' : '')),
        cl.length ? h('ul', { class: 'checklist' }, cl.map((c, i) => {
          const id = 'cl-' + t.id + '-' + i;
          return h('li', { class: c.done ? 'done' : '' },
            h('input', { type: 'checkbox', id, checked: !!c.done, onchange: (e) => { const next = cl.map((x, j) => j === i ? { ...x, done: e.target.checked } : x); updateTask(t.id, { checklist: next }); } }),
            h('label', { for: id }, rich(c.text)),
            h('button', { class: 'rm', type: 'button', 'aria-label': 'Quitar paso', onclick: () => updateTask(t.id, { checklist: cl.filter((_, j) => j !== i) }) }, '×'));
        })) : h('p', { style: 'margin:0;color:var(--muted);font-size:14px' }, 'Sin pasos todavía.'),
        h('form', { class: 'addcl', onsubmit: (e) => { e.preventDefault(); const inp = e.target.querySelector('input'); const v = inp.value.trim(); if (!v) return; inp.value = ''; updateTask(t.id, { checklist: [...cl, { text: v, done: false }] }); } },
          h('label', { for: 'd-addcl', class: 'sr' }, 'Nuevo paso'),
          h('input', { id: 'd-addcl', placeholder: 'Agregar paso', autocomplete: 'off' }),
          h('button', { class: 'btn', type: 'submit' }, 'Agregar'))),
      h('div', { style: 'display:flex;flex-direction:column;gap:6px' },
        h('label', { class: 'label', for: 'd-test' }, 'Cómo probarlo'),
        h('textarea', { id: 'd-test', onchange: (e) => updateTask(t.id, { test: e.target.value }) }, t.test || '')),
      h('div', { style: 'display:flex;flex-direction:column;gap:6px' },
        h('label', { class: 'label', for: 'd-notes' }, 'Notas'),
        h('textarea', { id: 'd-notes', onchange: (e) => updateTask(t.id, { notes: e.target.value }) }, t.notes || '')),
      h('div', { class: 'footer-actions' },
        h('span', null, t.updated_at ? 'Actualizada ' + new Date(t.updated_at).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : ''),
        S.confirmDelete
          ? h('span', { class: 'confirm' }, '¿Borrar la tarea?',
              h('button', { class: 'btn danger', type: 'button', onclick: () => { const id = t.id; closeTask(); write(() => db.doc('tasks/' + id).delete(), 'Tarea borrada'); } }, 'Sí, borrar'),
              h('button', { class: 'btn', type: 'button', onclick: () => { S.confirmDelete = false; renderDetail(); } }, 'No'))
          : h('button', { class: 'btn ghost danger', type: 'button', onclick: () => { S.confirmDelete = true; renderDetail(); } }, 'Borrar tarea')));
    box.hidden = false;
    if (keepFocus) { const el = document.getElementById(keepFocus); if (el) el.focus(); }
  }

  function render() { renderMiles(); renderSummary(); renderBoard(); renderDetail(); }

  function setFilter(id) { S.filter = id; pref('filter', id); render(); }
  function openTask(id) { S.openId = id; S.confirmDelete = false; render(); const el = document.getElementById('d-title'); if (el) el.focus(); }
  function closeTask() { S.openId = null; S.confirmDelete = false; render(); }
  function setStatus(id, status) {
    const t = S.tasks.find((x) => x.id === id);
    if (!t || t.status === status) return;
    updateTask(id, { status });
  }

  document.getElementById('new-btn').addEventListener('click', () => {
    const f = document.getElementById('new-form');
    f.hidden = !f.hidden;
    if (!f.hidden) { if (S.filter !== 'all') document.getElementById('new-ms').value = S.filter; document.getElementById('new-title').focus(); }
  });
  document.getElementById('new-cancel').addEventListener('click', () => { document.getElementById('new-form').hidden = true; });
  document.getElementById('new-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('new-title').value.trim();
    const milestone = document.getElementById('new-ms').value;
    if (!title) return;
    if (!milestone) { toast('Primero hace falta al menos un hito.'); return; }
    document.getElementById('new-title').value = '';
    document.getElementById('new-form').hidden = true;
    write(() => db.collection('tasks').add({ title, milestone, code: '', status: 'todo', order: Date.now(), checklist: [], test: '', notes: '', updated_at: now() }), 'Tarea agregada');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.openId && !e.defaultPrevented) closeTask(); });

  render();

  const use = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null);
  use.then((d) => {
    if (!d) { S.offline = true; S.loaded = true; render(); return; }
    db = d;
    let got = { m: false, t: false };
    const ready = () => { if (got.m && got.t) { S.loaded = true; } render(); };
    db.collection('milestones').orderBy('order').onSnapshot((snap) => {
      S.milestones = snap.docs.map((x) => ({ id: x.id, ...x.data() }));
      if (S.filter !== 'all' && !S.milestones.some((m) => m.id === S.filter)) S.filter = 'all';
      got.m = true; ready();
    }, () => { S.offline = true; render(); });
    db.collection('tasks').onSnapshot((snap) => {
      S.tasks = snap.docs.map((x) => ({ id: x.id, ...x.data() }));
      if (S.openId && !S.tasks.some((t) => t.id === S.openId)) S.openId = null;
      got.t = true; ready();
    }, () => { S.offline = true; render(); });
  }).catch(() => { S.offline = true; S.loaded = true; render(); });
})();
</script>
