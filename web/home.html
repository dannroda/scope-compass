<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio · Scope Compass</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="home.css">
<script src="settings.js"></script>
<script>
  // Transiciones entre páginas (D29): si el navegador cancela una, sus promesas se rechazan; se atienden acá, en el
  // <head>, porque pagereveal llega antes que los scripts con defer.
  (function () { var q = function (e) { var t = e.viewTransition; if (t) [t.ready, t.finished, t.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}); }); };
    addEventListener('pageswap', q); addEventListener('pagereveal', q); })();
</script>
<script src="home.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Scope Compass <small>Inicio</small></h1>
    <span class="conn" id="conn" role="status" hidden>Sin conexión con el Inicio · reintentando</span>
    <span class="today-date" id="date"></span>
    <button class="btn ghost settings-btn" id="settings-btn" type="button" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <!-- Captura rápida (31.2): se arma una vez; render() solo pone al día las listas del selector. -->
  <form class="capture" id="capture" hidden aria-label="Anotar en una lista">
    <label for="cap-text" class="sr">Anotar</label>
    <input type="text" id="cap-text" name="text" placeholder="Anotar…" autocomplete="off" required>
    <label for="cap-list" class="sr">En la lista</label>
    <select id="cap-list" name="list"></select>
    <label for="cap-due" class="sr">Fecha límite (opcional)</label>
    <input type="date" id="cap-due" name="due" title="Fecha límite (opcional)">
    <button class="btn primary" type="submit">Anotar</button>
  </form>
  <section class="hoy" aria-labelledby="hoy-t">
    <div class="sec-head"><h2 id="hoy-t">Hoy</h2><span class="muted sub">lo vencido, lo de hoy y lo que está en curso, de todos los proyectos</span>
      <div class="areas" id="areas" role="group" aria-label="Área"></div></div>
    <div class="hoy-list" id="hoy" aria-live="polite"></div>
  </section>
  <section class="semana" aria-labelledby="sem-t">
    <div class="sec-head"><h2 id="sem-t">Esta semana</h2><span class="muted sub">lo que vence en los próximos 7 días</span></div>
    <div class="hoy-list" id="semana"></div>
  </section>
  <section aria-labelledby="proj-t">
    <div class="sec-head"><h2 id="proj-t">Proyectos</h2>
      <button class="btn small add-btn" id="add-btn" type="button" aria-expanded="false" aria-controls="add">Agregar proyecto</button></div>
    <section class="add" id="add" hidden aria-label="Agregar proyecto"></section>
    <div class="projects" id="projects"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
