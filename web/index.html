<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope Compass</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script>
  // Transiciones entre páginas (D29): si el navegador cancela una, sus promesas se rechazan; se atienden acá, en el
  // <head>, porque pagereveal llega antes que los scripts con defer.
  (function () { var q = function (e) { var t = e.viewTransition; if (t) [t.ready, t.finished, t.updateCallbackDone].forEach(function (p) { if (p) p.catch(function () {}); }); };
    addEventListener('pageswap', q); addEventListener('pagereveal', q); })();
</script>
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <nav class="home-bar" aria-label="Inicio">
        <a class="home-link" id="home-link" href="#" hidden>← Inicio</a>
        <label for="project-switch" class="sr">Proyecto</label>
        <select id="project-switch" hidden></select>
      </nav>
      <h1><span id="project">Scope Compass</span></h1>
      <nav class="views" aria-label="Vistas"><a href="#" id="tab-board">Tablero</a><a href="#lists" id="tab-lists">Listas</a><a href="#docs" id="tab-docs">Documentos</a></nav>
    </div>
    <span class="conn" id="conn" role="status" hidden>Sin conexión con el hub · reintentando</span>
    <span class="gitmark" id="git" role="status" hidden></span>
    <button class="btn primary" id="new-btn" type="button">Nueva tarea</button>
  </header>
  <nav class="miles" id="miles" aria-label="Hitos"></nav>
  <section class="filters" id="filters" aria-label="Filtros"></section>
  <form class="newtask" id="new-form" hidden>
    <label for="new-title" class="sr">Título</label>
    <input type="text" id="new-title" placeholder="Qué hay que hacer" autocomplete="off" required>
    <label for="new-ms" class="sr">Hito</label>
    <select id="new-ms"></select>
    <button class="btn primary" type="submit">Agregar</button>
    <button class="btn ghost" type="button" id="new-cancel">Cancelar</button>
  </form>
  <section class="summary" id="summary" aria-live="polite"></section>
  <section class="warnings" id="warnings" role="alert" hidden></section>
  <main class="board" id="board" aria-label="Tablero"></main>
  <section class="tasklist" id="tasklist" aria-label="Lista de tareas" hidden></section>
  <section class="docs" id="docs" aria-label="Documentos" hidden></section>
  <section class="lists" id="lists" aria-label="Listas" hidden></section>
</div>
<aside class="detail" id="detail" hidden aria-label="Detalle de la tarea"></aside>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
