<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span id="project">Scope Compass</span> <small>tareas</small></h1>
    <button class="btn primary" id="new-btn" type="button">Nueva tarea</button>
  </header>
  <nav class="miles" id="miles" aria-label="Hitos"></nav>
  <form class="newtask" id="new-form" hidden>
    <label for="new-title" class="sr">Título</label>
    <input type="text" id="new-title" placeholder="Qué hay que hacer" autocomplete="off" required>
    <label for="new-ms" class="sr">Hito</label>
    <select id="new-ms"></select>
    <button class="btn primary" type="submit">Agregar</button>
    <button class="btn ghost" type="button" id="new-cancel">Cancelar</button>
  </form>
  <section class="summary" id="summary" aria-live="polite"></section>
  <main class="board" id="board" aria-label="Tablero"></main>
</div>
<aside class="detail" id="detail" hidden aria-label="Detalle de la tarea"></aside>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
